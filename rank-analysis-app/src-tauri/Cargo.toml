[package]
name = "rank-analysis"
authors = ["wnzzer"]
edition = "2021"

[lib]
name = "rank_analysis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 可选 Windows.Media.Ocr 引擎（A3.2）：`cargo build --features ocr-win`
# 默认关闭——未启用时大乱斗助手返回 ocr-not-configured，手动三选一不受影响。
ocr-win = ["dep:windows"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = "z"   # 优化级别设为 "z"，专注于大小优化
lto = true        # 启用链接时优化
codegen-units = 1 # 减少代码生成单元，提高优化效果
# 保持默认 unwind（不设 panic="abort"）：后台常驻任务（自动化/监控/shard）数量多，
# abort 语义下任何一个循环里的边缘数据 panic 都会直接杀死整个应用；unwind 下
# 只损失单个 task，且 sentry-panic 能捕获 panic 上报，可观测可恢复。
strip = true      # 剥离符号信息，减小二进制大小

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1.10.3"
reqwest = { version = "0.12", features = [
    "json",
    "stream",
] } # http client 用于访问 lcu 接口的客户端
# macOS 进程枚举与命令行读取：proc_listallpids / proc_pidpath / sysctl（lcu/util/token.rs）
libc = "0.2"
log = "0.4.0"
env_logger = "0.11"
base64 = "0.21"
tauri-plugin-http = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2.7.1" # 导入导出文件选择对话框
moka = { version = "0.12", features = ["future"] }
phf = { version = "0.12", features = ["macros"] } # 用于静态配置编译期生成
tokio = { version = "1", features = ["full"] }
urlencoding = "2.1.3" # 用于 URL 编码
tauri-plugin-updater = "2.9.0"
# 全局热键（B1：Alt+A 开关对局浮窗；游戏窗口无焦点时仍可触发）
tauri-plugin-global-shortcut = "2"
mlua = { version = "0.9", features = ["lua54", "vendored", "async"] }
futures = "0.3"
tokio-tungstenite = { version = "0.28", features = [
    "native-tls",
    "connect",
    "handshake",
] }
futures-util = "0.3"
native-tls = "0.2"
tokio-native-tls = "0.3"
url = "2.5"
tauri-plugin-mcp-bridge = "0.11"
# 错误上报（默认关闭，用户在设置中 opt-in；debug 构建默认开启便于调试）
# tauri-plugin-sentry 通过 Rust 后端统一转发前端 + 后端事件，前端无需额外 npm 依赖
# log + logs feature：把 `log` 记录转成 Sentry Structured Logs（见 observability.rs / main.rs）
sentry = { version = "0.42", features = ["log", "logs"] }
tauri-plugin-sentry = "0.5"
# 匿名设备 ID（observability.rs 持久化生成，仅用于 Sentry DAU 去重）
uuid = { version = "1", features = ["v4"] }
# 遇见过玩家全量库（P1-1）：bundled 免系统依赖，随应用自带的 SQLite
rusqlite = { version = "0.32", features = ["bundled"] }

# 海克斯大乱斗数据同步（mayhem/）：manifest 文件完整性校验（sha256-<hex>）
sha2 = "0.10"
hex = "0.4"

# ---- Windows 专属依赖 ----
# 这些 crate 只在 Windows 编译，避免 macOS/Linux 上因目标平台不支持而编译失败。
[target.'cfg(windows)'.dependencies]
ntapi = "0.4" # NtQueryInformationProcess 读取进程命令行（lcu/util/token.rs）
winapi = { version = "0.3.9", features = [
    "processthreadsapi",
    "handleapi",
    "tlhelp32",
    "psapi",
    "winbase",
    "minwindef",
    "ntdef",
    "libloaderapi",
    "memoryapi",
    "winnt",
    "shellapi",
    "winuser",
    "wingdi", # mayhem/capture.rs：BitBlt 屏幕区域抓取（A3.1 v1）
  ] } # Windows api，用于获取 lol 进程信息 / 提权重启 / 拉起登录客户端
# A3.2 OCR 引擎（可选，见 [features].ocr-win）：Windows.Media.Ocr 直连
windows = { version = "0.62", optional = true, features = [
    "Foundation",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
] }
winreg = "0.55" # 清理腾讯登录客户端注册的 LOL 开机自启项（command/launcher.rs）
