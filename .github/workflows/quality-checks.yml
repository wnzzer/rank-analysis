name: Quality Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  # fork 场景：PR 触发需要所有者批准，这里提供手动入口便于在 fork 上直接跑完整门禁
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-quality:
    name: Frontend Code Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./rank-analysis-app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: rank-analysis-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npx prettier --check "src/**/*.{js,jsx,ts,tsx,vue,json,css,scss,md}"

      - name: TypeScript type check
        run: npm run typecheck

      - name: Run unit tests with coverage
        run: npm run test:coverage

  rust-quality:
    # 必须按平台矩阵跑：token.rs / launcher.rs / system.rs 用 #[cfg(target_os)] 分叉出
    # Windows 与 macOS 两套实现，单跑 windows-latest 时 cfg(not(windows)) 分支根本不编译，
    # 其中的 clippy 告警与编译错误一律漏检（曾漏过 launcher.rs 的 needless_return）。
    name: Rust Code Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./rank-analysis-app/src-tauri

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: rank-analysis-app/src-tauri/target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run rustfmt
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run unit tests
        run: cargo test

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./rank-analysis-app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run npm audit
        run: npm audit --audit-level=moderate || echo "::warning::Security vulnerabilities found in npm dependencies. Please review."

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        run: cargo audit || echo "::warning::Security vulnerabilities found in Rust dependencies. Please review."
        working-directory: ./rank-analysis-app/src-tauri
