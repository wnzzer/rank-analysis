# 知识库构建：knowledge/ 源文件 → data/knowledge/knowledge.json
# 关联设计: docs/superpowers/specs/2026-07-11-ai-analysis-iteration-design.md §4.3
# 产物经 jsDelivr / GitCode 分发，客户端 knowledge 模块拉取（内置兜底同产物）
name: Knowledge Data

on:
  schedule:
    - cron: '17 3 * * *' # 每日一次，代价低（仅 demo 源文件重建，无网络依赖）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: knowledge-data
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 拉全量历史，否则 GitCode 镜像推送会漏 commit（对比 sync-gitcode.yml）

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run build tests
        run: node --test scripts/build-knowledge.test.mjs

      - name: Regenerate knowledge.json
        run: node scripts/build-knowledge.mjs

      - name: Verify artifact is committed
        run: |
          node -e "const d=require('./data/knowledge/knowledge.json');if(d.schemaVersion!==1)process.exit(1);console.log('schema ok, patch='+d.patch)"

      # ref 守卫：非 main 分支 dispatch 绝不推送
      - name: Commit and push if changed
        id: commit
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -z "$(git status --porcelain -- data/knowledge)" ]; then
            echo "no data changes"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/knowledge
          git commit -m "chore(data): 重建知识库 knowledge.json"
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN 推送不触发 sync-gitcode（GitHub 防递归），自带镜像推送
      - name: Mirror to GitCode
        if: steps.commit.outputs.pushed == 'true'
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          git push "https://wnzzer:${GITCODE_TOKEN}@gitcode.com/wnzzer/rank-analysis.git" HEAD:main --force