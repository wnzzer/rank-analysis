name: Probe GitHub Models (temporary)
on:
  push:
    branches: [feat/patch-notes-github-models]
permissions:
  contents: read
  models: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-notes/probe-github-models.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODELS: openai/gpt-4.1,openai/gpt-4o,openai/gpt-4.1-mini,openai/gpt-5-mini
